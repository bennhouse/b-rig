# Plugin della b-suite su Windows: build di tutti i plugin e installer VST3 per x64 e ARM64.
#   - avvio manuale (Actions > b-suite > Run workflow): installer come artifact del run
#   - tag b-suite-vX.Y.Z: gli installer Windows si aggiungono alla release
# macOS si compila e si testa in locale: tools/release.sh fa la build, i test e il .pkg sul Mac, crea il tag e la
# release; questa Action aggiunge solo Windows (dal Mac non si compila per Windows). Tutti i plugin hanno la stessa
# versione (shared/cmake/Suite.cmake); il controllo aggiornamenti dei plugin legge questi tag.
# Non parte a ogni push: nei repo privati i minuti Windows valgono il doppio.
name: b-suite

on:
  push:
    tags: ["b-suite-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_VERSION: "0.1.0"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # PowerShell spezzerebbe -DBSUITE_VERSION=0.1.0 sul punto
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          v="${GITHUB_REF_NAME#b-suite-v}"
          [[ "$GITHUB_REF" == refs/tags/b-suite-v* ]] || v="$DEFAULT_VERSION"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Configure
        # senza LTO: con MSVC la generazione di codice al link di 19 plugin richiedeva oltre un'ora
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DBSUITE_COPY_AFTER_BUILD=OFF -DBSUITE_LTO=OFF -DBSUITE_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release --parallel --target bsuite_plugins

      - name: Collect
        run: |
          mkdir -p vst3
          while read -r dir target; do
            target="${target%$'\r'}"   # Git su Windows può dare fine riga CRLF
            [[ -z "${dir:-}" || "$dir" == \#* ]] && continue
            cp -R "build/$dir/${target}_artefacts/Release/VST3/$dir.vst3" vst3/
          done < tools/installer/plugins.txt
          ls vst3

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=$env:VERSION /DArch=${{ matrix.arch }} `
            "/DSourceDir=$env:GITHUB_WORKSPACE\vst3" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" tools\installer\b-suite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: b-suite-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/b-suite-v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/installer

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # la release la crea di solito tools/release.sh con l'installer macOS (compilato in locale); qui si
      # aggiungono gli installer Windows. Se non c'è ancora, la si crea.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#b-suite-v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "b-suite $v beta" --prerelease --notes-file tools/installer/notes-b-suite.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
