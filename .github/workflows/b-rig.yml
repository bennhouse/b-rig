# b-rig su Windows: build (app, b-rig plugin, plugin della suite), test (x64) e installer per x64 e ARM64.
#   - avvio manuale (Actions > b-rig > Run workflow): installer come artifact del run
#   - tag b-rig-vX.Y.Z: gli installer Windows si aggiungono alla release
# macOS si compila e si testa in locale: tools/release.sh fa la build, i test e il .dmg sul Mac, crea il tag e la
# release; questa Action aggiunge solo Windows. Il nome del tag è quello che legge il controllo aggiornamenti.
# Non parte a ogni push: nei repo privati i minuti Windows valgono il doppio.
name: b-rig

on:
  push:
    tags: ["b-rig-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    # col tag gira solo se la variabile del repository WINDOWS_CI è "true" (Settings > Secrets and variables >
    # Actions > Variables). Finché è spenta gli installer Windows li compila un collaboratore con
    # tools/release-windows.ps1; a mano (Run workflow) gira sempre.
    if: github.event_name == 'workflow_dispatch' || vars.WINDOWS_CI == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # PowerShell spezzerebbe -DBSUITE_VERSION=0.1.0 sul punto
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            test: true
          - arch: arm64
            cmake_arch: ARM64
            test: false   # il runner è x64: l'eseguibile ARM64 si compila ma non si esegue
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#b-rig-v}"
          [[ "$GITHUB_REF" == refs/tags/b-rig-v* ]] || v="$(head -n1 VERSION.txt | tr -d '\r')"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.cmake_arch }} -DBSUITE_COPY_AFTER_BUILD=OFF -DBSUITE_LTO=OFF -DBSUITE_VERSION=${{ env.VERSION }}

      # l'app, b-rig come plugin e tutti i plugin (brig_release); --parallel 4 con il /MP limitato di Suite.cmake
      - name: Build
        run: |
          targets="brig_release"
          [[ "${{ matrix.test }}" == "true" ]] && targets="brig_release bsuite_tests"
          cmake --build build --config Release --parallel 4 --target $targets

      - name: Test
        if: matrix.test
        run: |
          while read -r dir target; do
            target="${target%$'\r'}"
            [[ -z "${dir:-}" || "$dir" == \#* ]] && continue
            mkdir -p "$dir/build"
            (cd "$dir" && "../build/$dir/${target}Tests_artefacts/Release/${target}Tests.exe" > /dev/null) || { echo "test falliti: $dir"; exit 1; }
            echo "test ok  $dir"
          done < tools/installer/plugins.txt
          mkdir -p b-rig/build
          (cd b-rig && ../build/b-rig/BRigTests_artefacts/Release/BRigTests.exe > /dev/null) || { echo "test falliti: b-rig"; exit 1; }
          echo "test ok  b-rig"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $stage = "build\stage"
          New-Item -ItemType Directory "$stage\rig", "$stage\suite" | Out-Null
          Copy-Item build\b-rig\BRig_artefacts\Release\b-rig.exe $stage
          Copy-Item -Recurse build\b-rig\BRigPlugin_artefacts\Release\VST3\b-rig.vst3 "$stage\rig"
          Get-Content tools\installer\plugins.txt | Where-Object { $_ -match '^b-' } | ForEach-Object {
            $dir, $target = $_.Trim() -split '\s+'
            Copy-Item -Recurse "build\$dir\${target}_artefacts\Release\VST3\$dir.vst3" "$stage\suite"
          }
          & $iscc /Q /DAppVersion=$env:VERSION /DArch=${{ matrix.arch }} `
            "/DStageDir=$env:GITHUB_WORKSPACE\$stage" `
            "/DIconFile=$env:GITHUB_WORKSPACE\build\b-rig\BRig_artefacts\JuceLibraryCode\icon.ico" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" b-rig\Installer\b-rig.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: b-rig-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/b-rig-v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/installer

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # la release la crea di solito tools/release.sh con l'installer macOS (compilato in locale); qui si
      # aggiungono gli installer Windows. Se non c'è ancora, la si crea.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#b-rig-v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "b-rig $v beta" --notes-file tools/installer/notes-b-rig.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
