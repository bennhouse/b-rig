# b-rig su Windows: build, test (x64) e installer per x64 e ARM64.
#   - avvio manuale (Actions > b-rig > Run workflow): installer come artifact del run
#   - tag b-rig-vX.Y.Z: gli installer Windows si aggiungono alla release
# macOS si compila e si testa in locale: tools/release.sh fa la build, i test e il .dmg sul Mac, crea il tag e la
# release; questa Action aggiunge solo Windows. Il nome del tag è quello che legge il controllo aggiornamenti.
# Non parte a ogni push: nei repo privati i minuti Windows valgono il doppio.
name: b-rig

on:
  push:
    tags: ["b-rig-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b-rig-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_VERSION: "0.1.0"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # PowerShell spezzerebbe -DBRIG_VERSION=0.1.0 sul punto
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            test: true
          - arch: arm64
            cmake_arch: ARM64
            test: false   # il runner è x64: l'eseguibile ARM64 si compila ma non si esegue
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#b-rig-v}"
          [[ "$GITHUB_REF" == refs/tags/b-rig-v* ]] || v="$DEFAULT_VERSION"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S b-rig -B b-rig/build -A ${{ matrix.cmake_arch }} -DBRIG_VERSION=${{ env.VERSION }}

      - name: Build
        run: |
          targets="BRig"
          [[ "${{ matrix.test }}" == "true" ]] && targets="BRig BRigTests"
          cmake --build b-rig/build --config Release --parallel --target $targets

      - name: Test
        if: matrix.test
        working-directory: b-rig
        run: ./build/BRigTests_artefacts/Release/BRigTests.exe

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=$env:VERSION /DArch=${{ matrix.arch }} `
            "/DSourceExe=$env:GITHUB_WORKSPACE\b-rig\build\BRig_artefacts\Release\b-rig.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" b-rig\Installer\b-rig.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: b-rig-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/b-rig-v')
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/installer

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # la release la crea di solito tools/release.sh con l'installer macOS (compilato in locale); qui si
      # aggiungono gli installer Windows. Se non c'è ancora, la si crea.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#b-rig-v}"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "b-rig $v beta" --prerelease --notes-file tools/installer/notes-b-rig.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
